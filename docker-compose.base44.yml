# Seedling — development stack for the Base44 preview.
#
# Runs the Vite dev server straight from the cloned source (bind mounted, with
# dependencies kept in a named volume) so edits in the editor hot-reload.
services:
  web:
    image: node:22
    working_dir: /workspace
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
      - seedling-node-modules:/workspace/node_modules
    environment:
      # Passed through from the sandbox; vite.config.js allows the preview host
      # only while BASE44_PREVIEW_MODE is exactly "1".
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  seedling-node-modules:
